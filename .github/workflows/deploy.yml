# Checks the recipe data, then publishes the site to GitHub Pages.
# If the check fails, nothing is published and the live site stays as it was.
# The app lives in the iron-kitchen/ folder of this repository.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check recipe data
        run: node iron-kitchen/tools/check.js
      - name: Assemble site (app files only)
        run: |
          mkdir _site
          cd iron-kitchen
          cp -r index.html app.js sw.js manifest.webmanifest robots.txt icons data recipes ../_site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
